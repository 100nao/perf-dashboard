# Fetches public holiday calendars, dome schedules, and travel-news RSS,
# then commits data/briefing.json. This does not read inboud-map.
# 08:40 JST every day. GitHub schedules are UTC and can start late.
name: Collect event calendar and daily news

on:
  schedule:
    - cron: "40 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-briefing
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the collector
        run: python3 scripts/test_collect_briefing.py

      - name: Collect
        run: python3 scripts/collect_briefing.py

      - name: Commit data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing.json
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update event calendar and daily news"
          git push
