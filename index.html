<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>perf-dashboard</title>
<style>
body{font-family:-apple-system,'Hiragino Sans',sans-serif;background:#f2f4f8;color:#222;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#fff;border:1px solid #d8dee8;border-radius:12px;padding:28px 26px;max-width:340px;width:90%;box-sizing:border-box;box-shadow:0 4px 18px rgba(20,40,80,.08)}
h1{font-size:18px;margin:0 0 6px}p{font-size:13px;color:#555;margin:0 0 14px}
input[type=password]{width:100%;box-sizing:border-box;font-size:16px;padding:10px;border:1px solid #b9c2cf;border-radius:8px;margin-bottom:10px}
label{font-size:13px;display:block;margin-bottom:14px}
button{background:#1f5fa8;color:#fff;border:0;border-radius:8px;font-size:16px;padding:11px;width:100%;cursor:pointer}
#err{color:#c00;font-size:13px;margin-top:10px;min-height:1em}
#status{color:#567;font-size:13px;margin-top:10px;min-height:1em}
</style></head><body>
<div class="card" id="loginCard">
<h1>perf-dashboard</h1>
<p>パスワードを入力してください</p>
<form id="f">
<input type="password" id="pw" autocomplete="current-password" autofocus>
<button type="submit">開く</button>
<div id="status"></div>
<div id="err"></div>
</form>
</div>
<script>
const WRAP_A = {"salt":"/J6OX7fzFZrCg/IHXl03hA==","iv":"S1Jq4Qj+IwKQQN9O","ct":"bStui0cdGDrmmJIGoCfTTcx5My0dPp6iIxYaYTmkp6444stXwG0KGhMr5T2q5Pz5"};
const PAYLOAD_PARTS = [1, 2, 3, 4].map(i => 'payload' + i + '-20261125v29.txt');
const LS_KEY = 'perf_pw';
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const subtle = crypto.subtle;
  const km = await subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const wk = await subtle.deriveKey({ name: 'PBKDF2', salt: unb64(WRAP_A.salt), iterations: 600000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const keyRaw = await subtle.decrypt({ name: 'AES-GCM', iv: unb64(WRAP_A.iv) }, wk, unb64(WRAP_A.ct));
  const key = await subtle.importKey('raw', keyRaw, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const parts = await Promise.all(PAYLOAD_PARTS.map(async u => {
    const r = await fetch(u);
    if (!r.ok) throw new Error('fetch ' + r.status);
    return r.text();
  }));
  const txt = parts.join('');
  const dot = txt.indexOf('.');
  const gz = await subtle.decrypt({ name: 'AES-GCM', iv: unb64(txt.slice(0, dot)) }, key, unb64(txt.slice(dot + 1)));
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(new Uint8Array(gz)); writer.close();
  const reader = ds.readable.getReader();
  const chunks = [];
  for (;;) { const r = await reader.read(); if (r.done) break; chunks.push(r.value); }
  let total = 0; for (const c of chunks) total += c.length;
  const buf = new Uint8Array(total); let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  const html = new TextDecoder().decode(buf);
  render(html);
}
function render(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  for (const a of [...doc.documentElement.attributes]) document.documentElement.setAttribute(a.name, a.value);
  document.head.innerHTML = doc.head.innerHTML;
  document.body.innerHTML = doc.body.innerHTML;
  for (const a of [...doc.body.attributes]) document.body.setAttribute(a.name, a.value);
  const scripts = [...document.querySelectorAll('script')];
  (async () => {
    for (const old of scripts) {
      const s = document.createElement('script');
      for (const a of [...old.attributes]) s.setAttribute(a.name, a.value);
      if (old.getAttribute('src')) {
        await new Promise(res => { s.onload = res; s.onerror = res; old.replaceWith(s); });
      } else {
        s.textContent = old.textContent;
        old.replaceWith(s);
      }
    }
  })();
}
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');
async function tryUnlock(pw) {
  errEl.textContent = '';
  statusEl.textContent = '開いています…（数秒かかります）';
  try {
    await unlock(pw);
  } catch (e) {
    statusEl.textContent = '';
    errEl.textContent = 'パスワードが違うか、データを取得できませんでした。';
    document.getElementById('loginCard').style.display = '';
  }
}
document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault();
  tryUnlock(document.getElementById('pw').value);
});
// パスワードは記憶しない（旧版で保存されたものがあれば消す）。開くのは手入力のときだけ。
try { localStorage.removeItem(LS_KEY); } catch (e) {}
</script></body></html>
